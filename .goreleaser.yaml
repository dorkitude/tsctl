version: 2

project_name: tsctl

before:
  hooks:
    - go mod tidy

builds:
  - id: tsctl
    binary: tsctl
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

# One macOS binary for Apple Silicon and Intel (tsctl_X_darwin_all.tar.gz),
# which the Homebrew cask installs. The per-arch darwin archives stay too.
universal_binaries:
  - id: tsctl
    ids: [tsctl]
    replace: false

# Sign the macOS binaries with the Developer ID certificate and notarize them
# with Apple (runs on Linux via quill). Skipped when the secrets are absent.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [tsctl]
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

archives:
  - id: default
    ids:
      - tsctl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  name_template: "tsctl {{ .Tag }}"

changelog:
  disable: true
